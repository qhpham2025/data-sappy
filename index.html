<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sappy · Master Data Pet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="engine.js"></script>
<style>
:root{
  --bg:#fff8f3; --card:#fff; --ink:#3a2e39; --muted:#8a7b88; --line:#f3e3ea;
  --pink:#ff7fa8; --pink2:#ffe0ea; --mint:#4cc79a; --mint2:#dcf7ec; --sun:#ffc23d; --sun2:#fff3cf;
  --sky:#5aaef5; --sky2:#e0f0ff; --grape:#9b7bff; --grape2:#efe9ff; --red:#ff5f6d; --red2:#ffe3e5;
  --shadow:0 4px 0 rgba(58,46,57,.07), 0 10px 26px rgba(58,46,57,.07);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Nunito,system-ui,sans-serif;
  background-image:radial-gradient(#ffeaf1 1.2px,transparent 1.2px);background-size:24px 24px}
h1,h2,h3{font-family:'Baloo 2',Nunito,sans-serif;margin:.2em 0 .4em;line-height:1.15}
h2{font-size:26px} h3{font-size:19px}
small,.muted{color:var(--muted)}
button{font:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:8px 18px;background:rgba(255,248,243,.92);backdrop-filter:blur(8px);border-bottom:2px dashed var(--line)}
.brand{display:flex;align-items:center;gap:8px}
.brand b{font-family:'Baloo 2';font-size:24px;display:block;line-height:1}
.brand small{font-size:12px}
.hp{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px}
.hbar{width:220px;height:16px;border-radius:99px;background:#fff;border:2px solid var(--ink);overflow:hidden}
.hbar.sm{width:110px;height:12px}
.hbar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--sun),var(--mint));background-size:220px 100%;transition:width .6s}
.spacer{flex:1}
.role select{font:inherit;font-weight:700;border:2px solid var(--ink);border-radius:12px;padding:4px 8px;background:#fff}
.bell{position:relative;border:2px solid var(--ink);background:#fff;border-radius:12px;padding:3px 9px;font-size:18px}
.bell span{position:absolute;top:-8px;right:-8px;background:var(--red);color:#fff;border-radius:99px;font-size:11px;padding:0 6px;font-weight:800}
.bell span:empty{display:none}
nav{position:sticky;top:60px;z-index:19;background:rgba(255,248,243,.96);border-bottom:2px dashed var(--line)}
.sections{display:flex;justify-content:center;gap:4px;padding:8px 18px 0;border-bottom:2px solid var(--ink)}
.sections button{border:2px solid var(--ink);border-bottom:none;border-radius:16px 16px 0 0;background:#f6ece6;padding:6px 20px;font-family:'Baloo 2';font-size:16px;font-weight:700;color:var(--muted);margin-bottom:-2px;transition:background .15s}
.sections button:hover{background:#fff}
.sections button.on{background:#fff;color:var(--ink);padding-bottom:8px;position:relative}
.sections button.on::after{content:'';position:absolute;left:0;right:0;bottom:-2px;height:4px;background:#fff}
.subtabs{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;padding:9px 18px;background:#fff}
.subtabs button{white-space:nowrap;border:1.5px solid transparent;background:none;border-radius:99px;padding:3px 13px;font-weight:800;font-size:14px;color:var(--muted)}
.subtabs button:hover{background:var(--pink2);color:var(--ink)}
.subtabs button.on{background:var(--pink);border-color:var(--ink);color:#fff;box-shadow:0 2px 0 var(--ink)}
main{max-width:1240px;margin:0 auto;padding:16px 18px 80px}
.tour{position:fixed;left:16px;bottom:16px;z-index:45;width:360px;background:#fff;border:2px solid var(--ink);border-radius:20px;padding:12px 14px;box-shadow:0 5px 0 var(--ink)}
.tour h3{margin:2px 0 4px}
.tour p{margin:0 0 10px;font-size:14px}
.tour .bar{height:6px;border-radius:9px;background:var(--line);overflow:hidden;margin-bottom:8px}
.tour .bar i{display:block;height:100%;background:var(--pink)}
.guide h3{margin-top:14px}.guide li{margin-bottom:4px}
.card{background:var(--card);border:2px solid var(--ink);border-radius:22px;padding:18px 22px;box-shadow:var(--shadow);margin-bottom:18px}
.card h2:first-child,.card h3:first-child{margin-top:0}
.center{text-align:center}
.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:2px solid var(--ink);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow)}
.kpi b{font-family:'Baloo 2';font-size:30px;display:block;line-height:1.1}
.kpi small{display:block}
.btn{border:2px solid var(--ink);border-radius:14px;padding:7px 14px;font-weight:800;background:#fff;box-shadow:0 3px 0 var(--ink);transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn.pink{background:var(--pink);color:#fff}.btn.mint{background:var(--mint);color:#fff}.btn.sun{background:var(--sun)}.btn.sky{background:var(--sky);color:#fff}
.btn.ghost{background:#fff}.btn.big{font-size:18px;padding:10px 22px;margin-top:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.xs{padding:2px 9px;font-size:12px;border-radius:10px;box-shadow:0 2px 0 var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;border-radius:99px;padding:1px 9px;font-size:12px;font-weight:800;border:1.5px solid currentColor}
.pill.red{color:#d63c4b;background:var(--red2)}.pill.mint{color:#1f8a63;background:var(--mint2)}.pill.sun{color:#9a6a00;background:var(--sun2)}.pill.sky{color:#1f6fb5;background:var(--sky2)}.pill.grape{color:#5b3fd1;background:var(--grape2)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 8px;border-bottom:1.5px dashed var(--line);text-align:left;vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.note{background:var(--sun2);border:2px dashed #e0b23a;border-radius:16px;padding:10px 14px;margin:10px 0}
.note.red{background:var(--red2);border-color:#f19aa3}
.note.mint{background:var(--mint2);border-color:#86d9b8}
.assume{font-size:12px;color:var(--muted);font-style:italic}

/* ---------- Sappy the blob ---------- */
.sappy{position:relative;width:var(--s);height:calc(var(--s)*1.02);display:inline-block;vertical-align:middle}
.sappy .body{position:absolute;inset:0 0 9% 0;border-radius:50% 50% 46% 46%/60% 60% 40% 40%;
  background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.9) 0 5%,transparent 6%),linear-gradient(165deg,var(--c1),var(--c2));
  border:calc(var(--s)*.02) solid var(--ink);box-shadow:inset calc(var(--s)*-.06) calc(var(--s)*-.07) 0 rgba(0,0,0,.07);animation:bob 2.4s ease-in-out infinite;transform-origin:50% 100%}
.sappy.happy{--c1:#ffe0ea;--c2:#ff9fbf}.sappy.ok{--c1:#fff3c4;--c2:#ffcf55}.sappy.sad{--c1:#e2f1ff;--c2:#8ec8ff}.sappy.sick{--c1:#eef8d8;--c2:#a6d47f}
.sappy .eye{position:absolute;top:38%;width:10%;height:13%;background:var(--ink);border-radius:50%}
.sappy .eye.l{left:29%}.sappy .eye.r{right:29%}
.sappy .eye::after{content:'';position:absolute;top:16%;left:20%;width:38%;height:34%;background:#fff;border-radius:50%}
.sappy.happy .eye{height:11%;border-radius:50% 50% 45% 45%}
.sappy .blush{position:absolute;top:55%;width:14%;height:7%;background:#ff6f99;opacity:.4;border-radius:50%}
.sappy .blush.l{left:14%}.sappy .blush.r{right:14%}
.sappy .mouth{position:absolute;left:50%;top:55%;width:18%;height:11%;transform:translateX(-50%);border:calc(var(--s)*.022) solid var(--ink);border-top:none;border-radius:0 0 50% 50%/0 0 100% 100%}
.sappy.happy .mouth{background:#ff6f8f;height:13%}
.sappy.ok .mouth{height:0;border-left:none;border-right:none;border-radius:4px;top:62%;width:13%}
.sappy.sad .mouth,.sappy.sick .mouth{top:63%;height:8%;border-top:calc(var(--s)*.022) solid var(--ink);border-bottom:none;border-radius:50% 50% 0 0/100% 100% 0 0}
.sappy.sick .eye{height:3%;top:44%;border-radius:3px}.sappy.sick .eye::after{display:none}
.sappy .tear{display:none;position:absolute;left:30%;top:51%;width:6%;height:10%;background:#5aaef5;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;animation:drip 1.8s infinite}
.sappy.sad .tear{display:block}
.sappy .sweat{display:none;position:absolute;right:12%;top:18%;font-size:calc(var(--s)*.16)}
.sappy.sick .sweat{display:block}
.sappy .hat{position:absolute;left:50%;top:-24%;transform:translateX(-50%) rotate(-10deg);font-size:calc(var(--s)*.4);z-index:2;line-height:1}
.sappy .shadow{position:absolute;bottom:0;left:22%;right:22%;height:8%;background:rgba(58,46,57,.14);border-radius:50%}
.sappy.eat .body{animation:chomp .35s 4}
.sappy.spit .body{animation:shake .35s 4}
.sappy.shock .body{animation:shake .2s 6}
@keyframes bob{50%{transform:translateY(-5%) scale(1.03,.97)}}
@keyframes chomp{50%{transform:scale(1.15,.85)}}
@keyframes shake{25%{transform:translateX(-7%) rotate(-6deg)}75%{transform:translateX(7%) rotate(6deg)}}
@keyframes drip{0%{transform:translateY(0);opacity:1}100%{transform:translateY(160%);opacity:0}}

.bubble{position:relative;display:inline-block;max-width:340px;background:#fff;border:2px solid var(--ink);border-radius:20px;padding:10px 14px;margin-top:12px;font-weight:700;text-align:left}
.bubble::before{content:'';position:absolute;top:-11px;left:50%;width:18px;height:18px;background:#fff;border-left:2px solid var(--ink);border-top:2px solid var(--ink);transform:translateX(-50%) rotate(45deg)}
.bubble.bad{background:var(--red2)}.bubble.bad::before{background:var(--red2)}
.bubble.good{background:var(--mint2)}.bubble.good::before{background:var(--mint2)}

/* ---------- Feed form ---------- */
.picks{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px}
.pick{border:2px solid var(--ink);border-radius:16px;background:#fff;padding:8px 12px;font-size:22px;display:flex;flex-direction:column;align-items:center;min-width:92px;box-shadow:0 3px 0 var(--ink)}
.pick span{font-size:13px;font-weight:800}
.pick.on{background:var(--sun)}
.field{margin-bottom:10px}
.field label{display:block;font-weight:800;font-size:13px;margin-bottom:3px}
.field input,.field select,textarea{width:100%;font:inherit;border:2px solid #d9c9d3;border-radius:12px;padding:8px 10px;background:#fffdfb}
.field input:focus,.field select:focus,textarea:focus{outline:none;border-color:var(--pink)}
.field.err input,.field.err select{border-color:var(--red);background:var(--red2)}
.req{color:var(--red);font-style:normal}
.lock{font-size:11px;background:var(--grape2);color:#5b3fd1;border-radius:99px;padding:1px 7px;margin-left:4px}
.tag{font-size:11px;background:var(--sky2);color:#1f6fb5;border-radius:99px;padding:1px 7px;margin-left:4px}
.route{background:var(--grape2);border-radius:14px;padding:8px 12px;font-weight:700;font-size:14px}
.route .step{display:inline-block;background:#fff;border:1.5px solid var(--ink);border-radius:10px;padding:0 8px;margin:2px}
.route .step.cond{background:var(--sun)}
.hint{margin-top:12px;font-weight:700;border-radius:14px;padding:8px 12px;display:none;text-align:left}
.hint.show{display:block;background:var(--sun2);border:2px dashed #e0b23a}
.hint.hot{background:var(--red2);border-color:#f19aa3}
.sticky{position:sticky;top:120px}

/* ---------- Swipe ---------- */
.deck{position:relative;height:470px;max-width:440px;margin:0 auto}
.scard{position:absolute;inset:0;background:#fff;border:2.5px solid var(--ink);border-radius:26px;padding:18px;box-shadow:var(--shadow);transition:transform .25s,opacity .25s;touch-action:none;user-select:none;overflow:hidden}
.scard.top{cursor:grab}
.scard:nth-child(2){transform:translateY(10px) scale(.96);z-index:-1}
.scard:nth-child(3){transform:translateY(20px) scale(.92);z-index:-2}
.stamp{position:absolute;top:22px;font-family:'Baloo 2';font-size:28px;border:4px solid;border-radius:12px;padding:0 10px;opacity:0;z-index:3;pointer-events:none}
.stamp.yes{left:18px;color:var(--mint);transform:rotate(-14deg)}.stamp.no{right:18px;color:var(--red);transform:rotate(14deg)}
.sc-h{display:flex;gap:10px;align-items:center}.sc-h b{font-family:'Baloo 2';font-size:20px;display:block;line-height:1.1}
.ticon{font-size:34px}
.sc-meta{margin:8px 0;font-size:13px}
.sc-fields table td{padding:4px 6px;font-size:13px}
.sc-route{font-size:12px;margin-top:6px}
.sc-route span{padding:1px 6px;border-radius:8px;background:#f5eef2}
.sc-route span.done{background:var(--mint2)}.sc-route span.waiting{background:var(--sun);font-weight:800}
.sc-foot{position:absolute;left:18px;right:18px;bottom:14px;display:flex;gap:10px;align-items:center;font-weight:700;font-size:13px}
.deckbtns{display:flex;justify-content:center;gap:30px;margin-top:18px}
.round{width:70px;height:70px;border-radius:50%;border:3px solid var(--ink);font-size:30px;background:#fff;box-shadow:0 4px 0 var(--ink)}
.round.yes{background:var(--mint2)}.round.no{background:var(--red2)}
.masked{background:var(--grape2);border-radius:8px;padding:0 6px;cursor:pointer;font-weight:800;color:#5b3fd1}

/* ---------- Track ---------- */
.tcard{border:2px solid var(--ink);border-radius:20px;padding:12px 14px;margin-bottom:12px;background:#fff}
.t-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.t-h b{font-family:'Baloo 2';font-size:17px}
.parcel{display:flex;align-items:flex-start;margin:10px 0 4px;overflow-x:auto}
.pstep{flex:1;min-width:96px;text-align:center;position:relative;font-size:12px}
.pstep::before{content:'';position:absolute;top:17px;left:-50%;width:100%;height:4px;background:#eadde4;z-index:0}
.pstep:first-child::before{display:none}
.pstep.done::before{background:var(--mint)}
.pstep .dot{position:relative;z-index:1;width:36px;height:36px;margin:0 auto 3px;border-radius:50%;border:2px solid var(--ink);background:#fff;display:flex;align-items:center;justify-content:center;font-size:17px}
.pstep.done .dot{background:var(--mint2)}
.pstep.waiting .dot{background:var(--sun);animation:pulse 1.2s infinite}
.pstep.waiting.od .dot{background:var(--red2)}
.pstep.rejected .dot{background:var(--red2)}
.pstep b{display:block;font-size:12px}
@keyframes pulse{50%{transform:scale(1.15)}}
.diary{max-height:620px;overflow:auto}
.dentry{border-left:4px solid var(--pink2);padding:4px 10px;margin-bottom:6px;font-size:13px}
.dentry.bad{border-color:var(--red);background:var(--red2)}
.dentry code{font-size:11px;color:var(--muted)}

/* ---------- Garden ---------- */
.garden{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.plot{background:#fff;border:2px solid var(--ink);border-radius:20px;padding:10px 8px 0;cursor:pointer;box-shadow:var(--shadow);overflow:hidden;transition:transform .15s}
.plot:hover{transform:translateY(-3px)}
.plot.on{outline:4px solid var(--pink);outline-offset:2px}
.plot-h{font-family:'Baloo 2';font-size:17px;text-align:center}
.bed{display:flex;justify-content:space-around;align-items:flex-end;height:150px}
.flower{display:flex;flex-direction:column;align-items:center;font-size:11px;font-weight:800;text-align:center}
.flower .head{font-size:30px;line-height:1;animation:sway 3s ease-in-out infinite;transform-origin:50% 100%}
.flower .stem{width:5px;background:#5cbf6a;border-radius:3px}
.flower.wilt .head{transform:rotate(60deg);animation:none;filter:saturate(.6)}
.flower.wilt .stem{background:#b59a6a}
.flower.bloom .head::after{content:'✨';font-size:14px;position:absolute;margin-left:-6px}
@keyframes sway{50%{transform:rotate(6deg)}}
.soil{height:14px;background:repeating-linear-gradient(90deg,#b07a4f 0 10px,#9c6a42 10px 20px);margin:0 -8px}
.plot-f{font-size:12px;font-weight:700;text-align:center;padding:6px 2px;background:#f8efe8;margin:0 -8px}
.heat td.cell{text-align:center;font-weight:800;border-radius:8px}
.actions li{margin-bottom:8px}
.chartbox{position:relative;height:280px}

/* ---------- Sorter ---------- */
.bins{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.bin{border:2px dashed var(--ink);border-radius:18px;padding:10px;min-height:180px;background:#fff}
.bin h3{margin:0 0 6px;font-size:16px}
.msg{background:#fff;border:2px solid var(--ink);border-radius:14px;padding:8px 10px;margin-bottom:8px;font-size:13px}
.msg b{display:block}
.msg.fly{animation:fly .5s ease-out}
@keyframes fly{from{transform:translateY(-30px) scale(.8);opacity:0}}

/* ---------- Lego ---------- */
.brick{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--ink);border-radius:10px;padding:5px 10px;margin:4px;font-weight:800;font-size:13px;box-shadow:0 3px 0 var(--ink);position:relative}
.brick::before{content:'';position:absolute;top:-7px;left:12px;width:10px;height:6px;border:2px solid var(--ink);border-bottom:none;border-radius:4px 4px 0 0;background:inherit}
.brick.f{background:var(--sky2)}.brick.f.sens{background:var(--grape2)}.brick.a{background:var(--mint2)}.brick.c{background:var(--sun)}
.brick button{border:none;background:none;padding:0 2px;font-size:13px}
.arrow{font-weight:800;color:var(--muted)}

/* ---------- misc ---------- */
.modal{position:fixed;inset:0;background:rgba(58,46,57,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal.hidden{display:none}
.mbox{background:#fff;border:3px solid var(--ink);border-radius:26px;padding:22px;max-width:640px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 8px 0 var(--ink)}
.pair{display:flex;align-items:center;gap:10px;margin:14px 0}
.mcard{flex:1;border:2px solid var(--ink);border-radius:18px;padding:12px;background:var(--pink2)}
.mcard b{display:block;font-family:'Baloo 2';font-size:18px}
.heart{font-family:'Baloo 2';font-size:22px;background:var(--red);color:#fff;width:74px;height:74px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:3px solid var(--ink);animation:pulse 1s infinite}
.term{background:#2b2230;color:#a8ffcf;border-radius:14px;padding:10px 12px;font-size:13px;min-height:110px;white-space:pre-wrap}
.json{background:#f8f2f5;border-radius:14px;padding:10px 12px;font-size:12px;max-height:220px;overflow:auto}
#toasts{position:fixed;right:16px;bottom:16px;z-index:60;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{background:#fff;border:2px solid var(--ink);border-radius:16px;padding:9px 14px;font-weight:700;box-shadow:0 4px 0 var(--ink);max-width:380px;animation:fly .3s}
.notes{position:fixed;right:16px;top:64px;z-index:40;width:380px;max-height:70vh;overflow:auto;background:#fff;border:2px solid var(--ink);border-radius:20px;padding:12px;box-shadow:var(--shadow)}
.notes.hidden{display:none}
.notes div{font-size:13px;padding:6px 0;border-bottom:1.5px dashed var(--line)}
.confetti{position:fixed;top:-40px;z-index:70;font-size:26px;pointer-events:none;animation:fall 1.8s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.seasbar{display:flex;align-items:flex-end;gap:4px;height:90px}
.seasbar div{flex:1;background:var(--pink2);border:1.5px solid var(--ink);border-radius:6px 6px 0 0;text-align:center;font-size:10px;font-weight:800}
svg text{font-family:Nunito,sans-serif}
@media (max-width:900px){.grid2,.grid3,.garden,.bins,.kpis{grid-template-columns:1fr 1fr}.hbar{width:120px}}
@media (max-width:600px){.grid2,.grid3,.garden,.bins,.kpis{grid-template-columns:1fr}.hp{display:none}main,header,nav{padding-left:16px;padding-right:16px}}
</style>
</head>
<body>
<header>
  <div class="brand"><span id="miniSappy"></span><div><b>Sappy</b><small>Lives Group · your Master Data Pet</small></div></div>
  <div class="hp"><div class="hbar sm"><i id="hpbar"></i></div><span id="hptxt"></span></div>
  <div class="spacer"></div>
  <button class="btn xs" onclick="openGuide()">❓ Guide</button>
  <button class="btn xs pink" onclick="startTour()">🎬 Demo tour</button>
  <label class="role"><small>I am</small> <select id="roleSel" onchange="setMe(this.value)"></select></label>
  <button class="bell" onclick="toggleNotes()" title="Teams notifications">🔔<span id="bellN"></span></button>
</header>
<nav id="tabs"></nav>
<main id="main"></main>
<div id="notes" class="notes hidden"></div>
<div id="toasts"></div>

<script>

const { NOW, HOUR, DAY, NH, MONTHS, COUNTRIES, PRODUCTS, DUPS, ORDERS, INBOX_COUNTS, INBOX, CLASSES, sum } = E;
const MASTER = E.MASTER.slice();
let clock = NOW;
const tick = () => (clock += 9 * 60e3);

const PEOPLE = {
  amy:    { name: 'Amy',     role: 'Requestor',        title: 'Product Manager · SPD',        emoji: '👩‍🔬' },
  marcus: { name: 'Marcus',  role: 'Requestor',        title: 'Regional Sales · QTG (new BU)', emoji: '🧑‍💼' },
  daniel: { name: 'Daniel',  role: 'BU Head',          title: 'Business Unit Head',           emoji: '🧔' },
  weijie: { name: 'Wei Jie', role: 'Finance',          title: 'Finance Manager',              emoji: '🧮' },
  nurul:  { name: 'Nurul',   role: 'QA/RA',            title: 'Quality & Regulatory Affairs', emoji: '🧪' },
  siti:   { name: 'Siti',    role: 'Business Support', title: 'Business Support',             emoji: '📋' },
  priya:  { name: 'Priya',   role: 'MDM',              title: 'MDM Analyst',                  emoji: '🛠️' },
};
const ROLE_OWNER = { 'BU Head': 'daniel', 'Finance': 'weijie', 'QA/RA': 'nurul', 'Business Support': 'siti', 'MDM': 'priya' };
const SEE_SENSITIVE = ['Finance', 'MDM'];

// The whole request process is data, not code: the MDM team edits this in "Rule Lego".
const RULES = {
  Customer: { icon: '🏥', fields: [

  ], chain: ['BU Head', 'Finance', 'MDM'], cond: [] },
  Vendor: { icon: '🚚', fields: [
    { k: 'name', label: 'Vendor name', req: 1, dup: 1, ph: 'e.g. BioNova Reagents' },
    { k: 'taxno', label: 'Tax / registration no.', req: 1 },
    { k: 'bank', label: 'Bank name', req: 1 },
    { k: 'acct', label: 'Bank account no.', req: 1, sens: 1 },

    { k: 'supplier', label: 'Supplier', req: 1 },
  ], chain: ['BU Head', 'Business Support', 'MDM'], cond: [{ k: 'ivd', v: 'Yes', add: 'QA/RA', after: 'BU Head' }] },

    { k: 'owner', label: 'Owner', req: 1 },
    { k: 'budget', label: 'Budget code', req: 1 },
  ], chain: ['Finance', 'MDM'], cond: [] },
};
function chainFor(type, f) {
  const r = RULES[type], c = r.chain.slice();
  (r.cond || []).forEach(x => { if (f[x.k] === x.v && !c.includes(x.add)) c.splice(Math.max(0, c.indexOf(x.after) + 1), 0, x.add); });
  return c;
}

// ---------- tamper-evident diary (hash chain) ----------
const DIARY = [];
function cyrb53(str) { let h1 = 0xdeadbeef, h2 = 0x41c6ce57; for (let i = 0; i < str.length; i++) { const ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); } h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909); h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909); return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(16).padStart(14, '0'); }
const sealOf = (prev, e) => cyrb53(prev + '|' + e.t + '|' + e.who + '|' + e.text);
function diary(who, text, t = clock) { const prev = DIARY.length ? DIARY[DIARY.length - 1].hash : 'GENESIS'; const e = { t, who, text, prev }; e.hash = sealOf(prev, e); DIARY.push(e); }
function verifyDiary() { let prev = 'GENESIS'; for (let i = 0; i < DIARY.length; i++) { const e = DIARY[i]; if (e.prev !== prev || sealOf(prev, e) !== e.hash) return i; prev = e.hash; } return -1; }

// ---------- seed requests ----------
const REQS = [], seedEvents = [];
function seed(id, type, requester, entity, country, fields, daysAgo, gaps, live) {
  const t0 = NOW - daysAgo * DAY, chain = chainFor(type, fields);
  const r = { id, type, requester, entity, country, fields, created: t0, steps: chain.map(role => ({ role, who: ROLE_OWNER[role], status: 'todo', at: null, since: null })), cur: 0, status: 'Pending', sap: null };
  seedEvents.push({ t: t0, who: PEOPLE[requester].name, text: `submitted ${id} · new ${type} “${fields.name}”` });
  let t = t0;
  gaps.forEach((g, i) => { t += g * DAY; r.steps[i].status = 'done'; r.steps[i].at = t; seedEvents.push({ t, who: PEOPLE[r.steps[i].who].name, text: `approved ${id} as ${r.steps[i].role}` }); });
  r.cur = gaps.length;
  if (r.cur < r.steps.length) { r.steps[r.cur].status = 'waiting'; r.steps[r.cur].since = t; }
  if (live) { r.status = 'Live'; r.sap = live; seedEvents.push({ t: t + 60e3, who: 'Priya', text: `created ${live} in SAP B1 from ${id} via Service Layer` }); }
  REQS.unshift(r);
}
seed('MDM-0147', 'Cost Center', 'siti', 'QTS', 'VN', { name: 'QTS Vietnam Field Service', owner: 'Marcus', budget: 'BC-QTS-VN-07' }, 6, [0.4, 0.3], 'CC-QTS-0071');
seed('MDM-0149', 'Customer', 'amy', 'SPD', 'MY', { name: 'KPJ Damansara Specialist Hospital', address: '119 Jalan SS20/10, Petaling Jaya', taxno: 'MY-200301009876', email: 'ap@kpjdamansara.example', credit: '45 days' }, 1.2, [0.3, 0.4]);
seed('MDM-0151', 'Item', 'amy', 'SPD', 'SG', { name: 'Product A — Lyme IgG Reagent Kit 96T', line: 'Product A — IVD reagents', uom: 'Kit', ivd: 'Yes', licence: 'HSA-IVD-26-0912', storage: '2–8 °C', supplier: 'BioNova Reagents Pte Ltd' }, 4.2, [0.3]);
seed('MDM-0152', 'Vendor', 'marcus', 'QTG', 'VN', { name: 'Mekong Cold Chain Co., Ltd', taxno: '0312345678', bank: 'Vietcombank', acct: '0071000654821', swift: 'BFTVVNVX', payterms: '45 days' }, 2.6, [0.2]);
seed('MDM-0153', 'Customer', 'marcus', 'QTG', 'VN', { name: 'Tam Anh General Hospital', address: '2B Pho Quang, Tan Binh, HCMC', taxno: '0309876543', email: 'ketoan@tamanh.example', credit: '30 days' }, 0.3, []);
seedEvents.sort((a, b) => a.t - b.t).forEach(e => diary(e.who, e.text, e.t));

// ---------- app state ----------
const S = { tab: 'home', me: 'amy', feedType: 'Item', draft: {}, missing: new Set(), resolvedDup: null, merged: new Set(), peeked: new Set(),
  party: 0, anim: null, bubble: null, bubbleCls: '', dupsBlocked: 0, approvals: {}, nextId: 154, codeN: 410, notes: [], unread: 0,
  sorted: null, cbC: 'ALL', cbP: 'ALL', gardenC: 'SG', mineOnly: false, legoType: 'Item', tamper: null };

// ---------- helpers ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => Math.round(n).toLocaleString('en');
const pct = x => x == null ? '—' : (x >= 0 ? '+' : '') + (x * 100).toFixed(1) + '%';
const flag = cc => (COUNTRIES.find(c => c.c === cc) || {}).f || '';
const cname = cc => (COUNTRIES.find(c => c.c === cc) || {}).n || cc;
const sleep = ms => new Promise(r => setTimeout(r, ms));
function ago(t, to = clock) { const h = (to - t) / HOUR; return h < 1 ? Math.max(1, Math.round(h * 60)) + ' min' : h < 48 ? Math.round(h) + ' h' : (h / 24).toFixed(1) + ' days'; }
const overdue = r => r.status === 'Pending' && r.steps[r.cur] && clock - r.steps[r.cur].since > 48 * HOUR;
const labelOf = (type, k) => ((RULES[type]?.fields || []).find(f => f.k === k) || {}).label || k;
const isSens = (type, k) => !!((RULES[type]?.fields || []).find(f => f.k === k) || {}).sens;

function health() {
  let h = 100;
  h -= REQS.filter(overdue).length * 15;
  h -= MASTER.filter(m => m.dupOf && !S.merged.has(m.code)).length * 10;
  h -= REQS.filter(r => r.status === 'Pending').length * 3;
  return Math.max(5, Math.min(100, h));
}
function mood(h = health()) { if (Date.now() < S.party) return 'happy'; return h >= 80 ? 'happy' : h >= 60 ? 'ok' : h >= 40 ? 'sad' : 'sick'; }
const MOODTXT = { happy: 'Sappy is thriving! 🌈', ok: 'Sappy is… fine. 😐', sad: 'Sappy is sad 🥺', sick: 'Sappy is sick 🤒' };
function sappy(m, size = 160, hat = '', extra = '') {
  return `<div class="sappy ${m} ${extra}" style="--s:${size}px">${hat ? `<div class="hat">${hat}</div>` : ''}<div class="body"><div class="eye l"></div><div class="eye r"></div><div class="blush l"></div><div class="blush r"></div><div class="mouth"></div><div class="tear"></div><div class="sweat">💦</div></div><div class="shadow"></div></div>`;
}

function toast(html, ms = 3200) { const d = document.createElement('div'); d.className = 'toast'; d.innerHTML = html; $('#toasts').appendChild(d); setTimeout(() => d.remove(), ms); }
function note(html) { S.notes.unshift({ t: clock, html }); S.unread++; toast(html); }
function toggleNotes() { const n = $('#notes'); n.classList.toggle('hidden'); S.unread = 0; n.innerHTML = '<h3>🔔 Teams notifications</h3>' + (S.notes.map(x => `<div>${x.html}<br><small>${new Date(x.t).toLocaleString('en-SG')}</small></div>`).join('') || '<small>Nothing yet</small>'); renderHeader(); }
function confetti(e = '🎉') { for (let i = 0; i < 26; i++) { const s = document.createElement('span'); s.className = 'confetti'; s.textContent = [e, '✨', '💖', '🌸'][i % 4]; s.style.left = Math.random() * 100 + 'vw'; s.style.animationDelay = Math.random() * .6 + 's'; document.body.appendChild(s); setTimeout(() => s.remove(), 2600); } }
function modal(html) { $('#mbox').innerHTML = html; $('#modal').classList.remove('hidden'); }
function closeModal() { $('#modal').classList.add('hidden'); render(); }
function ask(title, ph) {
  return new Promise(res => {
    modal(`<h2>${title}</h2><textarea id="askT" rows="3" placeholder="${esc(ph)}"></textarea><div class="row" style="margin-top:10px"><button class="btn pink" id="askOk">Send</button><button class="btn ghost" id="askNo">Cancel</button></div>`);
    $('#askT').focus();
    $('#askOk').onclick = () => { const v = $('#askT').value.trim(); if (!v) { $('#askT').style.borderColor = 'var(--red)'; return; } $('#modal').classList.add('hidden'); res(v); };
    $('#askNo').onclick = () => { $('#modal').classList.add('hidden'); res(null); };
  });
}

// ---------- tabs ----------
const TABS = [['home', '🏠', "Sappy's Room"], ['feed', '🍼', 'Feed Sappy'], ['swipe', '👉', 'Swipe Approvals'], ['track', '📦', 'Track & Diary'],
  ['garden', '🌱', "Sappy's Garden"], ['crystal', '🔮', 'Crystal Ball'], ['sorter', '📮', 'Inbox Sorter'], ['lego', '🧩', 'Rule Lego'], ['board', '🏆', 'Leaderboard'], ['hood', '⚙️', 'Under the Hood']];
function go(t) { S.tab = t; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
function setMe(k) { S.me = k; S.bubble = null; render(); toast(`${PEOPLE[k].emoji} You are now <b>${PEOPLE[k].name}</b> · ${PEOPLE[k].role}`); }

function renderHeader() {
  const h = health();
  $('#miniSappy').innerHTML = sappy(mood(h), 42);
  $('#hpbar').style.width = h + '%';
  $('#hptxt').textContent = h + '/100 data health';
  $('#roleSel').innerHTML = Object.entries(PEOPLE).map(([k, p]) => `<option value="${k}" ${k === S.me ? 'selected' : ''}>${p.emoji} ${p.name} · ${p.role}</option>`).join('');
  $('#bellN').textContent = S.unread || '';
  const btn = ([k, i, l]) => {
    let badge = '';
    if (k === 'swipe') { const role = PEOPLE[S.me].role, n = REQS.filter(r => r.status === 'Pending' && r.steps[r.cur]?.role === role).length; if (n) badge = ` (${n})`; }
    return `<button class="${S.tab === k ? 'on' : ''}" onclick="go('${k}')">${i} ${l}${badge}</button>`;
  };
  const active = NAV_GROUPS.find(g => g[2].includes(S.tab));
  $('#tabs').innerHTML = `<div class="sections">${NAV_GROUPS.map(g => `<button class="${g === active ? 'on' : ''}" onclick="go('${g[2][0]}')">${g[0]} ${g[1]}</button>`).join('')}</div>
    <div class="subtabs">${active[2].map(k => btn(TABS.find(t => t[0] === k))).join('')}</div>`;
  renderTour();
}
const NAV_GROUPS = [['🐣', 'MDM Workflow', ['home', 'feed', 'swipe', 'track']], ['🌏', 'Regional Insights', ['garden', 'crystal', 'sorter']], ['🛠️', 'Setup & Rollout', ['lego', 'board', 'hood']]];

}
const TOUR = [
  { tab: 'home', me: 'amy', t: '1 · Meet Sappy', d: 'Sappy is sick 🤒: two approvals have been stuck for days and three duplicate records live in SAP B1. Its health = the health of the master data.' },
  { tab: 'feed', me: 'amy', t: '2 · Amy needs an item code', d: 'Item is selected. Set <b>“Is it an IVD?” = Yes</b>: the licence field and QA/RA step appear automatically. Then click <b>🍼 Feed</b> with blanks to watch Sappy spit it out.', go: () => { S.feedType = 'Item'; S.draft = {}; } },

  { tab: 'swipe', me: 'siti', t: '5 · Next approver', d: 'Siti (Business Support) swipes right on the Lyme kit.' },

let tourI = -1;
function startTour() { tourI = 0; tourStep(); }
function tourStep() { const s = TOUR[tourI]; if (s.go) s.go(); if (s.me) S.me = s.me; S.bubble = null; S.tab = s.tab; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
function tourMove(d) { tourI = Math.max(0, Math.min(TOUR.length - 1, tourI + d)); tourStep(); }
function endTour() { tourI = -1; renderTour(); }
function renderTour() {
  let el = $('#tour'); if (tourI < 0) { if (el) el.remove(); return; }
  if (!el) { el = document.createElement('div'); el.id = 'tour'; el.className = 'tour'; document.body.appendChild(el); }

  el.innerHTML = `<div class="bar"><i style="width:${(tourI + 1) / TOUR.length * 100}%"></i></div><small>🎬 Demo tour · step ${tourI + 1} of ${TOUR.length}${s.me ? ` · you are ${PEOPLE[s.me].emoji} ${PEOPLE[s.me].name}` : ''}</small><h3>${s.t}</h3><p>${s.d}</p>

}
let charts = [];

  $('#main').innerHTML = VIEWS[S.tab]();

}

// =============== VIEWS ===============
const VIEWS = {}, AFTER = {};

// ---------- Home ----------
VIEWS.home = () => {
  const h = health(), m = mood(h), od = REQS.filter(overdue), twins = MASTER.filter(x => x.dupOf && !S.merged.has(x.code)), pend = REQS.filter(r => r.status === 'Pending');
  const reasons = [
    ...od.map(r => `<li>⏰ <b>${r.id}</b> has waited <b>${ago(r.steps[r.cur].since)}</b> for ${PEOPLE[r.steps[r.cur].who].name} (${r.steps[r.cur].role}) <span class="pill red">−15</span> <button class="btn xs" onclick="nudge('${r.id}')">Nudge in Teams</button></li>`),
    ...twins.map(t => `<li>👯 Evil twin in SAP B1: “${esc(t.name)}” <span class="pill red">−10</span></li>`),
    pend.length ? `<li>🍽️ ${pend.length} requests still digesting <span class="pill sun">−${pend.length * 3}</span></li>` : '',
  ].join('');
  return `
  <div class="grid2">
    <div class="card center" id="homeSappy">
      ${sappy(m, 210, Date.now() < S.party ? '🎉' : '')}
      <h2>${MOODTXT[m]}</h2>
      <div class="row" style="justify-content:center"><div class="hbar"><i style="width:${h}%"></i></div><b>${h}/100</b></div>
      <p class="muted" style="max-width:460px;margin:10px auto 0">Sappy is Lives Group's Master Data Pet. Its health <b>is</b> the health of your SAP B1 master data: stuck approvals make it hungry, duplicates make it sick, clean data makes it bloom. Nobody wants to be the one who starved Sappy.</p>
    </div>
    <div class="card">

      ${S.tamper ? `<div class="note red">😱 Entry #${bad + 1} no longer matches its seal. Sappy caught it!</div>` : ''}

function gColor(g) { return g == null ? '#eee' : g < -0.03 ? '#ffd9d4' : g < 0.05 ? '#fff1c9' : g < 0.15 ? '#d6f5e3' : '#9fe3c3'; }
function allCustomers() { return COUNTRIES.flatMap(C => E.customerRows(C.c, S.merged).map(r => ({ ...r, cc: C.c }))); }
function actionsList() {
  const A = []; let best = null;
  COUNTRIES.forEach(C => PRODUCTS.forEach(P => { const g = E.growth(E.countrySeries(C.c, P.p)); if (!best || g.yoy > best.g.yoy) best = { C, P, g }; }));
  const fw = E.forward(best.C.c, best.P.p);
  A.push(`📈 <b>Stock up: ${best.C.f} ${best.C.n} · ${best.P.n}</b> is growing fastest (${pct(best.g.yoy)} YoY). Sappy forecasts <b>${fmt(sum(fw.sappy))}</b> units for Nov–Jan vs <b>${fmt(sum(fw.base))}</b> with today's 6-month average, so raise allocation by ~${pct(sum(fw.sappy) / sum(fw.base) - 1)} before the December budget-flush peak.`);
  const cs = allCustomers();
  cs.filter(c => c.churn.length).forEach(c => {
    const dup = DUPS.find(d => d.dupOf === c.code && !S.merged.has(d.code));
    A.push(dup ? `👻 <b>${esc(c.name)}</b> looks like it's leaving (${c.churn.map(p => p + ' ' + pct(c.g[p].mom)).join(', ')}), but it's <b>not</b>. Orders moved to its duplicate record “${esc(dup.name)}”. <b>Merge the twin before calling sales.</b>`
      : `🥀 <b>Save the account: ${flag(c.cc)} ${esc(c.name)}</b> — ${c.churn.map(p => `Product ${p} ${pct(c.g[p].mom)}`).join(', ')} in 3 months. Book an account review within 2 weeks and check for competitor tenders.`);
  });
  cs.flatMap(c => c.gaps.map(p => ({ c, p, pot: c.potential[p] }))).sort((a, b) => b.pot - a.pot).slice(0, 3).forEach(({ c, p, pot }) =>
    A.push(`🪴 <b>Cross-sell Product ${p} to ${flag(c.cc)} ${esc(c.name)}</b>: it buys ${PRODUCTS.filter(x => !c.gaps.includes(x.p)).map(x => x.p).join(' & ')} but never ${p}. Est. <b>+${fmt(pot)} units/month</b> (50% of the peer median).`));
  A.push(`❄️ <b>Plan around the February dip</b> (~${Math.round((1 - BT.S[1]) * 100)}% below average, Lunar New Year / Tết). Pull promotions into January and March, and don't read February as churn.`);
  const hidden = ORDERS.filter(o => DUPS.some(d => d.code === o.code && !S.merged.has(d.code))).reduce((s, o) => s + o.units, 0);
  if (hidden) A.push(`🧼 <b>Clean first:</b> ${fmt(hidden)} units of real demand are booked under duplicate customer records and distort customer-level views. Merge them in 🏠 Sappy's Room.`);
  return A;
}

    { label: 'Actual POs', data: y.concat([null, null, null]), borderColor: '#3a2e39', backgroundColor: '#3a2e39', borderWidth: 3, pointRadius: 2, tension: .3 },
    { label: "🧓 Grandma's 6-mo average", data: mk(b, fw.base), borderColor: '#c9945a', backgroundColor: '#c9945a', borderDash: [6, 5], borderWidth: 3, pointRadius: 3, spanGaps: true },
    { label: '🔮 Sappy', data: mk(s, fw.sappy), borderColor: '#ff5c95', backgroundColor: '#ff5c95', borderWidth: 3, pointRadius: 3, tension: .3, spanGaps: true }] },
    options: { maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } }, scales: { y: { title: { display: true, text: 'PO units / month' } } } } }));
};

// ---------- Inbox Sorter ----------
VIEWS.sorter = () => {
  const bins = Object.entries(CLASSES).map(([k, c]) => {
    const items = (S.sorted || []).filter(x => x.r.cls === k);
    const next = { PO: '→ Draft sales order in SAP B1 for sales admin to confirm', ENQ: '→ Routed to country sales rep in Teams (1-day SLA)', FUP: '→ Auto-reply with live order status', MDM: '→ Turned into a pre-filled 🍼 Feed Sappy draft' }[k];
    return `<div class="bin"><h3>${c.icon} ${c.label} <small>(${items.length})</small></h3><small>${next}</small>${items.map(x => `<div class="msg fly"><b>${flag(x.m.cc)} ${esc(x.m.from)}</b>${esc(x.m.text)}<br><span class="pill grape">${Math.round(x.r.conf * 100)}% sure</span>${x.r.qty ? ` <span class="pill mint">qty ${x.r.qty} ${x.r.unit}</span>` : ''}${x.r.product ? ` <span class="pill sky">Product ${x.r.product}</span>` : ''}${k === 'MDM' ? ` <button class="btn xs" onclick="toDraft('${esc(x.m.text).replace(/'/g, '')}')">🍼 open draft</button>` : ''}</div>`).join('')}</div>`;
  }).join('');
  return `<div class="card"><div class="row" style="justify-content:space-between"><div><h2>📮 Inbox Sorter</h2><p class="muted">The shared mailbox mixes real purchase orders with enquiries, chasers and new-account requests. Sappy sorts them so only real POs count as demand.</p></div>
      <button class="btn pink big" onclick="sortInbox()">🪄 Let Sappy sort ${INBOX.length} emails</button></div>
    ${S.sorted ? '' : `<div>${INBOX.map(m => `<div class="msg"><b>${flag(m.cc)} ${esc(m.from)}</b>${esc(m.text)}</div>`).join('')}</div>`}
    ${S.sorted ? `<div class="bins">${bins}</div>` : ''}</div>
  <div class="card"><h3>🧪 Try your own message</h3><div class="row"><input id="tryMsg" style="flex:1;font:inherit;border:2px solid #d9c9d3;border-radius:12px;padding:8px" placeholder="e.g. Please supply 30 kits of Product A, PO 5521 attached"><button class="btn sun" onclick="tryClassify()">Sort it</button></div><div id="tryOut" style="margin-top:8px"></div>
  <p class="assume">Prototype uses a transparent keyword model so the business can read the rules. Production: Azure AI Language custom classifier (or a small LLM) in Power Automate, retrained on the team's own corrections.</p></div>`;
};
async function sortInbox() { S.sorted = []; render(); for (const m of INBOX) { S.sorted.push({ m, r: E.classify(m.text) }); render(); await sleep(170); } toast('✨ Sorted! Only 🛒 POs count as demand in the Garden.'); }
function tryClassify() { const t = $('#tryMsg').value; if (!t) return; const r = E.classify(t), c = CLASSES[r.cls]; $('#tryOut').innerHTML = `<div class="note">${c.icon} <b>${c.label}</b> · ${Math.round(r.conf * 100)}% sure${r.qty ? ` · qty ${r.qty} ${r.unit}` : ''}${r.product ? ` · Product ${r.product}` : ''}</div>`; }
function toDraft(text) { const n = text.match(/for ([A-Z][\w ]+?)( —|\.|,| please|$)/), item = /item/i.test(text); S.feedType = item ? 'Item' : 'Customer'; S.draft = { name: item ? 'Product A — Lyme IgG Reagent Kit 96T' : (n ? n[1].trim() : ''), country: 'Malaysia' }; S.bubble = '📮 I pre-filled this from the email. Just add the missing bits!'; S.bubbleCls = ''; go('feed'); }

// ---------- Rule Lego ----------
VIEWS.lego = () => {
  const t = S.legoType, r = RULES[t], roles = Object.keys(ROLE_OWNER);
  return `<div class="grid2"><div class="card"><h2>🧩 Rule Lego: change the process without IT</h2>
    <p class="muted">Every form field, required flag, sensitive flag and approval step is a block the MDM team can snap on or off. Changes go live on the 🍼 form instantly and are logged in the diary.</p>
    <div class="picks">${Object.keys(RULES).map(k => `<button class="pick ${k === t ? 'on' : ''}" onclick="S.legoType='${esc(k)}';render()">${RULES[k].icon}<span>${esc(k)}</span></button>`).join('')}</div>
    <h3>Fields</h3><div>${r.fields.map((f, i) => `<span class="brick f ${f.sens ? 'sens' : ''}">${esc(f.label)} <button title="required" onclick="legoToggle(${i},'req')">${f.req ? '⭐' : '☆'}</button><button title="sensitive" onclick="legoToggle(${i},'sens')">${f.sens ? '🔒' : '🔓'}</button>${f.k === 'name' ? '' : `<button title="remove" onclick="legoDel(${i})">✕</button>`}</span>`).join('')}</div>
    <div class="row" style="margin-top:8px"><input id="nfLabel" placeholder="New field, e.g. Cold-chain partner" style="flex:1;font:inherit;border:2px solid #d9c9d3;border-radius:12px;padding:6px 10px"><label><input type="checkbox" id="nfReq" checked> required</label><label><input type="checkbox" id="nfSens"> sensitive</label><button class="btn xs sky" onclick="legoAddField()">➕ Snap on</button></div>
    <h3 style="margin-top:16px">Approval chain</h3><div>${r.chain.map((c, i) => `<span class="brick a">${c} <button onclick="legoDelStep(${i})">✕</button></span>${i < r.chain.length - 1 ? '<span class="arrow">→</span>' : ''}`).join('')} <span class="arrow">→</span> <span class="brick" style="background:#fff">📦 SAP B1</span></div>
    ${(r.cond || []).map(c => `<div><span class="brick c">IF ${esc(c.k.toUpperCase())} = ${esc(c.v)} → add ${c.add} after ${c.after}</span></div>`).join('')}
    <div class="row" style="margin-top:8px"><select id="nsRole" style="font:inherit;border-radius:10px;padding:4px">${roles.map(x => `<option>${x}</option>`).join('')}</select><button class="btn xs mint" onclick="legoAddStep()">➕ Add approval step</button></div></div>
  <div class="card"><h3>🎉 Add a whole new domain or business unit</h3><p class="muted">E.g. a new regulatory process for clinical-trial sites, or Marcus's new BU. A few times a year, done in minutes by the MDM team.</p>
    <div class="row"><input id="ndName" placeholder="e.g. Clinical Trial Site" style="flex:1;font:inherit;border:2px solid #d9c9d3;border-radius:12px;padding:6px 10px"><input id="ndIcon" value="🔬" style="width:54px;font:inherit;border:2px solid #d9c9d3;border-radius:12px;padding:6px"><button class="btn pink" onclick="legoNewDomain()">➕ New domain</button></div>
    <div class="row" style="margin-top:10px"><input id="nbu" placeholder="New business unit code, e.g. QTV" style="flex:1;font:inherit;border:2px solid #d9c9d3;border-radius:12px;padding:6px 10px"><button class="btn sun" onclick="legoNewBU()">➕ New BU</button></div>
    <p>Current business units: ${ENTITIES.map(e => `<span class="pill grape">${esc(e)}</span>`).join(' ')}</p>
    <div class="note"><b>Why this matters:</b> today, adding a step means redrafting email templates and distribution lists and briefing everyone (Marcus's team waited two weeks). With Sappy the rule <i>is</i> the process: the new BU's requests route correctly from day one.</div>
    <p class="assume">Production: these rules live in a SharePoint list / Dataverse table that Power Apps and Power Automate read at runtime. Only a new SAP B1 object type (UDO) needs a one-off partner change.</p></div></div>`;
};
function legoLog(t) { diary(PEOPLE[S.me].name, `changed rules: ${t}`); }
function legoToggle(i, k) { const f = RULES[S.legoType].fields[i]; f[k] = f[k] ? 0 : 1; legoLog(`${S.legoType}.${f.label} ${k === 'req' ? 'required' : 'sensitive'} = ${!!f[k]}`); render(); }
function legoDel(i) { const f = RULES[S.legoType].fields.splice(i, 1)[0]; legoLog(`removed field ${S.legoType}.${f.label}`); render(); }
function legoAddField() { const l = $('#nfLabel').value.trim(); if (!l) return; RULES[S.legoType].fields.push({ k: 'f' + Date.now().toString(36), label: l, req: $('#nfReq').checked ? 1 : 0, sens: $('#nfSens').checked ? 1 : 0 }); legoLog(`added field ${S.legoType}.${l}`); toast(`🧩 “${esc(l)}” snapped onto the ${esc(S.legoType)} form. Live now in 🍼`); render(); }
function legoDelStep(i) { const r = RULES[S.legoType]; if (r.chain.length < 2) return toast('Sappy needs at least one approver 🙈'); const s = r.chain.splice(i, 1)[0]; legoLog(`removed ${s} from ${S.legoType} chain`); render(); }
function legoAddStep() { const r = RULES[S.legoType], v = $('#nsRole').value; if (r.chain.includes(v)) return toast(`${v} is already in the chain`); const at = r.chain.indexOf('MDM'); r.chain.splice(at < 0 ? r.chain.length : at, 0, v); legoLog(`added ${v} to ${S.legoType} chain`); toast(`🧩 ${v} added. New ${esc(S.legoType)} requests route there automatically.`); render(); }
function legoNewDomain() { const n = $('#ndName').value.trim(); if (!n || RULES[n]) return; RULES[n] = { icon: $('#ndIcon').value || '🔬', fields: [{ k: 'name', label: n + ' name', req: 1, dup: 1 }, { k: 'owner', label: 'Owner', req: 1 }], chain: ['BU Head', 'MDM'], cond: [] }; S.legoType = n; legoLog(`created new domain “${n}” (no IT ticket 🎉)`); S.party = Date.now() + 5000; confetti('🧩'); toast(`🥳 New domain <b>${esc(n)}</b> is live in 🍼 Feed Sappy!`); render(); }
function legoNewBU() { const n = $('#nbu').value.trim().toUpperCase(); if (!n || ENTITIES.includes(n)) return; ENTITIES.push(n); legoLog(`added business unit ${n}`); S.party = Date.now() + 4000; confetti('🏢'); toast(`🏢 ${esc(n)} added. Their requests now route correctly from day one.`); render(); }

// ---------- Leaderboard ----------
VIEWS.board = () => {
  const base = { daniel: [2.8, 0.4, 41], weijie: [4.0, 0.9, 38], nurul: [4.1, 0.6, 22], siti: [3.2, 0.5, 30], priya: [1.5, 0.3, 64] };
  const rows = Object.entries(base).map(([k, [b, a, n]]) => ({ k, b, a, n: n + (S.approvals[k] || 0) })).sort((x, y) => x.a - y.a);
  const most = rows.reduce((m, r) => r.n > m.n ? r : m, rows[0]);
  const ents = [['SPD', 2.1, 96], ['QTS', 2.6, 91], ['QTG', 4.4, 78]].concat(ENTITIES.slice(3).map(e => [e, '—', '—']));
  return `<div class="grid2"><div class="card"><h2>🏆 Sappy's Favourite Humans</h2><p class="muted">Average time to act on a request, before (email) vs after (Sappy pilot). Badges are for fun; nobody gets shamed, Sappy just nudges.</p>
    <table><tr><th>#</th><th>Approver</th><th class="num">Email era</th><th class="num">With Sappy</th><th class="num">Swipes</th><th>Badge</th></tr>${rows.map((r, i) => `<tr><td>${['🥇', '🥈', '🥉', '4', '5'][i]}</td><td>${PEOPLE[r.k].emoji} <b>${PEOPLE[r.k].name}</b><br><small>${PEOPLE[r.k].role}</small></td><td class="num">${r.b} days</td><td class="num"><b>${Math.round(r.a * 24)} h</b></td><td class="num">${r.n}</td><td>${i === 0 ? '⚡ Lightning Paws' : r === most ? "🍪 Sappy's Snack Provider" : r.b - r.a > 3 ? '🚀 Most Improved' : '🌱 Steady Gardener'}</td></tr>`).join('')}</table>
    <p class="assume">Pilot numbers are illustrative assumptions for the demo; live counts update when you swipe.</p></div>
  <div class="card"><h3>🏢 Business unit league</h3><table><tr><th>BU</th><th class="num">Avg request → SAP B1</th><th class="num">On-time (≤3 days)</th></tr>${ents.map(([e, d, p]) => `<tr><td><b>${esc(e)}</b></td><td class="num">${d}${d === '—' ? '' : ' days'}</td><td class="num">${p}${p === '—' ? '' : '%'}</td></tr>`).join('')}</table>
    <div class="note">💡 QTG (Marcus's new BU) is slowest, so Sappy auto-sends them a 2-minute “how to feed me” onboarding card in Teams.</div>
    <h3>Adoption tricks baked in</h3><ul><li>📧 <b>Email auto-reply</b> from the MDM mailbox: “Sappy can't eat emails 🥺 tap here to feed me properly” with a link to a pre-filled form.</li><li>🚫 <b>No form, no record</b>: the MDM team only creates SAP B1 records from Sappy after go-live (month 2).</li><li>💬 <b>Lives where people already are</b>: Teams tab + adaptive cards, no new login.</li><li>🎖️ Monthly “Sappy's Favourite Human” shout-out in the town hall.</li></ul></div></div>`;
};

// ---------- Under the Hood ----------
VIEWS.hood = () => `<div class="card"><h2>⚙️ Under the hood: how Sappy connects to SAP B1</h2>
  <svg viewBox="0 0 1100 330" style="width:100%;height:auto">
    <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#3a2e39"/></marker></defs>
    <g font-size="14" font-weight="700" fill="#3a2e39">
      ${[[20, 40, 'Requestors', 'Amy · Marcus', '#ffe0ea'], [20, 190, 'Inbound email', 'shared mailbox', '#ffe0ea'],
         [230, 40, '🍼 Sappy form', 'Power Apps (Teams tab)', '#fff3cf'], [230, 190, '📮 Inbox Sorter', 'Power Automate + AI classifier', '#fff3cf'],
         [450, 40, '🧩 Rules', 'SharePoint list / Dataverse', '#efe9ff'], [450, 190, '👉 Approvals', 'Teams adaptive cards · reminders', '#efe9ff'],
         [670, 40, '📜 Diary', 'Dataverse, hash-chained', '#e0f0ff'], [670, 190, '🛠️ MDM final check', 'Priya · one click', '#e0f0ff'],
         [880, 115, '📦 SAP Business One', 'Service Layer REST API', '#dcf7ec'], [880, 250, '🌱🔮 Garden + Crystal Ball', 'Python job · Power BI', '#dcf7ec']]
        .map(([x, y, t, s, c]) => `<rect x="${x}" y="${y}" width="190" height="64" rx="16" fill="${c}" stroke="#3a2e39" stroke-width="2"/><text x="${x + 95}" y="${y + 28}" text-anchor="middle">${t}</text><text x="${x + 95}" y="${y + 48}" text-anchor="middle" font-size="11" font-weight="600" fill="#8a7b88">${s}</text>`).join('')}
      ${[[210, 72, 230, 72], [210, 222, 230, 222], [420, 72, 450, 72], [325, 104, 325, 190], [420, 222, 450, 222], [640, 222, 670, 222], [545, 104, 545, 190], [640, 72, 670, 72], [765, 190, 765, 104], [860, 222, 900, 179], [975, 179, 975, 250]]
        .map(([a, b, c, d]) => `<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="#3a2e39" stroke-width="2.5" marker-end="url(#ar)"/>`).join('')}
      <text x="335" y="150" font-size="11" fill="#8a7b88">MDM emails → drafts</text>
      <text x="1000" y="225" font-size="11" fill="#8a7b88">nightly PO extract</text>
    </g></svg>
  <p class="muted">The record is created in SAP B1 through the <b>Service Layer</b> (SAP B1's official REST API) from the approved form data, with Priya's one-click final check kept as a human control. Nightly, clean PO data flows back out to the Garden and Crystal Ball.</p></div>
  <div class="grid3">
    <div class="card"><h3>🛠️ Build plan (≈10 weeks)</h3><ol><li><b>Wk 1–3</b> Form + rules + Teams approvals (MDM team + 1 Power Platform maker)</li><li><b>Wk 4–5</b> Diary, masking, reminders, tracking</li><li><b>Wk 6–7</b> SAP B1 Service Layer connector (<i>outside partner, ~10 days</i>)</li><li><b>Wk 8–9</b> PO extract + forecast job + Garden (analyst)</li><li><b>Wk 10</b> Pilot with SPD, then QTS & QTG</li></ol></div>
    <div class="card"><h3>💸 Rough cost (year 1)</h3><table><tr><td>Power Apps / Automate premium (~25 users)</td><td class="num">~S$8k</td></tr><tr><td>SAP B1 connector partner (10 days)</td><td class="num">~S$12k</td></tr><tr><td>Internal time (maker + analyst)</td><td class="num">~0.5 FTE × 3 mo</td></tr><tr><td><b>Total cash</b></td><td class="num"><b>~S$20–25k</b></td></tr></table><p class="assume">Assumes existing M365 E3/E5 licences; prices indicative.</p></div>
    <div class="card"><h3>🙅 Deliberately NOT in v1</h3><ul><li>Fully automatic SAP creation with no human check: Priya stays the final gate until trust is earned.</li><li>An LLM chatbot for intake: a form is faster and auditable.</li><li>A full MDG / golden-record platform: overkill for SAP B1 scale.</li><li>Training ML dedupe models: fuzzy rules first, ML once labels exist.</li><li>A mobile app: Teams mobile already covers swiping.</li></ul></div></div>`;

// boot (index.html#garden opens a tab directly)
if (VIEWS[location.hash.slice(1)]) S.tab = location.hash.slice(1);
window.addEventListener('error', e => { document.title = 'ERR: ' + e.message; });
render();
if (location.hash === '#tour') startTour();
toast('👋 Hi! I\'m Sappy. New here? Click <b>❓ Guide</b> or <b>🎬 Demo tour</b> at the top.', 5000);
</script>
